<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Grantdrop">
  <defs>
    <linearGradient id="gdm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A212B" />
      <stop offset="1" stop-color="#080B10" />
    </linearGradient>
    <linearGradient id="gdm-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4AE3A0" />
      <stop offset="0.55" stop-color="#2DD4BF" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
  </defs>

  <!-- Full bleed: the platform applies its own mask shape, so no rounded corners
       and no transparency. The mark is scaled to ~0.68 and centred so it stays
       inside the central 80% safe zone on every launcher mask. -->
  <rect width="64" height="64" fill="url(#gdm-bg)" />

  <g transform="translate(32 32) scale(0.68) translate(-32 -32)">
    <path
      d="M44.6 32 A12.6 12.6 0 1 0 38.3 20.6"
      fill="none"
      stroke="url(#gdm-mark)"
      stroke-width="7.4"
      stroke-linecap="round"
    />
    <path
      d="M44.6 32 H34.2"
      fill="none"
      stroke="url(#gdm-mark)"
      stroke-width="7.4"
      stroke-linecap="round"
    />
    <rect x="41.4" y="13.2" width="6.2" height="6.2" rx="1.6" fill="#4AE3A0" />
  </g>
</svg>
